<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2E205">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Meu Dia — ALLTORAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-page:#141116;
    --yellow:#F2E205;
    --black:#141116;
    --white:#FFFFFF;
    --pink:#EC1E8C;
    --gray-label:#9C9895;
    --paper-shadow: 0 8px 18px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--bg-page);
    font-family:'Archivo',sans-serif;
    color:var(--white);
    overscroll-behavior-y:contain;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    max-width:1200px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg-page);
    position:relative;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* HEADER */
  .header{
    background:var(--yellow);
    width:100vw;
    margin-left:calc(50% - 50vw);
    position:relative;
    overflow:hidden;
    border-bottom:3px solid var(--black);
  }
  .header::after{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(26,26,26,0.10) 1.5px, transparent 1.5px);
    background-size: 16px 16px;
    opacity:0.5;
    pointer-events:none;
  }
  .header-inner{
    max-width:1200px;
    margin:0 auto;
    padding:28px 28px 22px;
    position:relative;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--black);
    opacity:0.65;
    font-weight:700;
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    display:inline-block;
    width:22px; height:2px;
    background:var(--black);
    opacity:0.7;
  }
  .title-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
    position:relative;
  }
  h1{
    font-family:'DM Serif Display',serif;
    font-weight:700;
    font-size:44px;
    margin:6px 0 0;
    color:var(--black);
  }
  .accent-script{
    font-style:italic;
    color:var(--pink);
  }
  .subtitle{
    display:block;
    font-family:'Archivo',sans-serif;
    font-style:italic;
    color:var(--black);
    opacity:0.55;
    font-size:14px;
    margin-top:2px;
  }

  /* TOOLBAR / WEEK NAV */
  .toolbar{
    display:flex;
    gap:10px;
    padding:16px 28px;
    flex-wrap:wrap;
    align-items:center;
    background:var(--bg-page);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  button{
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    border:2px solid transparent;
    border-radius:8px;
    padding:12px 20px;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active{ transform:scale(0.95); }
  .btn-nav{
    background:transparent;
    color:var(--white);
    border:2px solid rgba(255,255,255,0.3);
    padding:8px 14px;
    font-size:16px;
    line-height:1;
  }
  .btn-nav:hover{ border-color:rgba(255,255,255,0.6); }
  .btn-today{
    background:transparent;
    color:var(--gray-label);
    border:2px solid rgba(255,255,255,0.2);
    padding:8px 14px;
    font-size:11px;
  }
  .btn-today:hover{ color:var(--white); border-color:rgba(255,255,255,0.5); }
  .week-label{
    font-family:'DM Serif Display',serif;
    font-style:italic;
    color:var(--pink);
    font-size:18px;
    padding:0 4px;
    white-space:nowrap;
  }
  .toolbar-spacer{ flex:1; min-width:8px; }
  .offline-badge{
    display:none;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.3px;
    color:var(--black);
    background:var(--yellow);
    padding:5px 10px;
    border-radius:6px;
  }
  .offline-badge.show{ display:inline-block; }
  .btn-sync{ background:transparent; color:var(--white); border:2px solid rgba(255,255,255,0.35); }
  .btn-sync:hover{ border-color:rgba(255,255,255,0.7); }
  .btn-sync[disabled]{ opacity:0.5; cursor:wait; }
  .sync-status{
    font-size:12px;
    color:var(--gray-label);
    font-style:italic;
  }

  /* WEEK BOARD */
  .board-wrap{
    padding:20px 28px 40px;
  }
  .week-board{
    display:flex;
    gap:12px;
    overflow-x:auto;
    scroll-snap-type:x proximity;
    padding-bottom:6px;
  }
  .day-card{
    background:var(--white);
    border-radius:14px;
    min-width:160px;
    flex:1 1 160px;
    display:flex;
    flex-direction:column;
    scroll-snap-align:start;
    box-shadow:var(--paper-shadow);
    max-height:calc(100vh - 230px);
    overflow:hidden;
  }
  .day-card.drag-over{ outline:3px dashed var(--pink); outline-offset:-3px; }
  .day-header{
    padding:12px 14px 10px;
    border-bottom:2px solid rgba(20,17,22,0.08);
    flex-shrink:0;
  }
  .day-card.today .day-header{
    background:var(--yellow);
  }
  .day-name{
    display:block;
    font-size:10.5px;
    letter-spacing:1px;
    font-weight:700;
    color:#8A8680;
    text-transform:uppercase;
  }
  .day-card.today .day-name{ color:rgba(20,17,22,0.65); }
  .day-num{
    font-family:'DM Serif Display',serif;
    font-size:24px;
    color:var(--black);
  }
  .task-list{
    flex:1;
    overflow-y:auto;
    padding:8px 10px;
    display:flex;
    flex-direction:column;
    gap:4px;
    min-height:60px;
  }
  .task-item{
    display:flex;
    align-items:flex-start;
    gap:6px;
    padding:6px 4px;
    border-radius:6px;
  }
  .task-item:hover{ background:rgba(20,17,22,0.05); }
  .task-check{
    width:18px; height:18px;
    border-radius:5px;
    border:2px solid var(--black);
    background:var(--white);
    flex-shrink:0;
    margin-top:2px;
    cursor:pointer;
    padding:0;
    position:relative;
  }
  .task-item.done .task-check{ background:var(--pink); border-color:var(--pink); }
  .task-item.done .task-check::after{
    content:"✓";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--white);
    font-size:12px;
    line-height:1;
  }
  .task-text{
    flex:1;
    font-size:13.5px;
    font-weight:500;
    color:var(--black);
    outline:none;
    word-break:break-word;
    line-height:1.35;
    padding-top:1px;
  }
  .task-item.done .task-text{ text-decoration:line-through; opacity:0.4; }
  .task-item.from-calendar{ border-left:3px solid var(--yellow); padding-left:5px; }
  .task-drag-handle{
    flex-shrink:0;
    width:16px;
    text-align:center;
    color:rgba(20,17,22,0.28);
    cursor:grab;
    touch-action:none;
    font-size:13px;
    line-height:1.4;
    padding-top:2px;
    user-select:none;
  }
  .task-drag-handle:active{ cursor:grabbing; color:rgba(20,17,22,0.6); }
  .task-close{
    font-size:13px;
    color:rgba(20,17,22,0.3);
    cursor:pointer;
    display:none;
    flex-shrink:0;
    padding:0 2px;
  }
  .task-item:hover .task-close{ display:block; }
  .add-task-row{
    padding:8px 8px 12px 12px;
    border-top:1px dashed rgba(20,17,22,0.12);
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .add-task-input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    font-family:'Archivo',sans-serif;
    font-size:13px;
    color:var(--black);
    outline:none;
  }
  .add-task-input::placeholder{ color:#B7B2AC; }
  .add-task-confirm{
    flex-shrink:0;
    width:24px; height:24px;
    padding:0;
    border-radius:6px;
    border:none;
    background:transparent;
    color:var(--black);
    opacity:0.35;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .add-task-confirm svg{ width:16px; height:16px; }
  .add-task-confirm:hover{ opacity:0.7; }
  .add-task-confirm:active{ transform:scale(0.9); }

  /* CHECKLIST SEMANAL — itens sem dia fixo, pra depois arrastar pros dias */
  .week-checklist{
    background:var(--white);
    border-radius:14px;
    box-shadow:var(--paper-shadow);
    margin-bottom:14px;
    overflow:hidden;
  }
  .checklist-header{
    padding:14px 16px 8px;
    border-bottom:2px solid rgba(20,17,22,0.08);
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .checklist-title{
    font-family:'DM Serif Display',serif;
    font-size:19px;
    color:var(--black);
  }
  .checklist-hint{
    font-size:11px;
    font-style:italic;
    color:#8A8680;
  }
  .checklist-list{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding:8px 12px;
    max-height:220px;
    overflow-y:auto;
  }
  .checklist-empty{
    font-size:12.5px;
    color:#B7B2AC;
    font-style:italic;
    padding:6px 4px 10px;
  }

  /* Bonequinho arrastado durante o drag entre dias */
  .larot-drag-ghost{
    position:fixed; left:0; top:0; z-index:999; pointer-events:none;
    transform:translate(-50%,-50%);
    background:var(--yellow); color:var(--black);
    font-family:'Archivo',sans-serif; font-size:12.5px; font-weight:600;
    padding:8px 12px; border-radius:8px;
    box-shadow:0 8px 18px rgba(0,0,0,0.4);
    max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.2); border-radius:4px; }

  /* ---------- Larot (assistente de voz) ---------- */
  #larotMicBtn{
    position:fixed; right:16px; bottom:16px; z-index:500;
    width:76px; height:76px; border:none; background:transparent; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,0.45));
    transition:transform .15s ease;
  }
  #larotMicBtn:hover{ transform:scale(1.06); }
  #larotMicBtn img{ width:100%; height:100%; object-fit:contain; pointer-events:none; user-select:none; }
  #larotMicImgActive{ display:none; }
  #larotMicImgMuted{ display:block; filter:none; }
  #larotMicBtn.listening #larotMicImgActive{ display:block; }
  #larotMicBtn.listening #larotMicImgMuted{ display:none; }
  #larotMicBtn.paused #larotMicImgActive{ display:none; }
  #larotMicBtn.paused #larotMicImgMuted{ display:block; filter:grayscale(100%); }
  #larotMicBtn.listening{ animation:larotPulse 1.1s ease-in-out infinite; }
  @keyframes larotPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
  }
  #larotToast{
    position:fixed; right:16px; bottom:100px; z-index:500; max-width:280px;
    background:var(--black); color:#fff; border:1px solid rgba(255,255,255,0.15); border-radius:14px;
    padding:12px 16px; font-family:'Archivo',sans-serif; font-size:13.5px; line-height:1.4;
    box-shadow:0 6px 20px rgba(0,0,0,0.5); display:none;
  }
  #larotToast.show{ display:block; }
  #larotDebugToggle{
    position:fixed; left:16px; bottom:16px; z-index:500;
    width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,0.2);
    background:var(--black); color:#fff; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; opacity:0.55;
  }
  #larotDebugPanel{
    display:none; position:fixed; left:16px; bottom:58px; z-index:500;
    width:min(360px, calc(100vw - 32px)); max-height:40vh; overflow-y:auto;
    background:rgba(0,0,0,0.92); color:#8f8; border:1px solid rgba(255,255,255,0.15); border-radius:10px;
    padding:10px 12px; font-family:monospace; font-size:11px; line-height:1.5; white-space:pre-wrap;
  }
  #larotDebugPanel.show{ display:block; }

  @media (max-width:600px){
    .header-inner{ padding:calc(16px + env(safe-area-inset-top)) 18px 16px; }
    .eyebrow{ font-size:9px; gap:6px; }
    .eyebrow::before{ width:14px; }
    h1{ font-size:28px; margin-top:4px; }
    .subtitle{ font-size:12px; }

    .toolbar{ padding:10px 14px; gap:6px; }
    .week-label{ font-size:14px; }
    .btn-sync{ padding:10px 14px; font-size:10px; }
    .sync-status{ font-size:10px; width:100%; }

    .board-wrap{ padding:12px 10px 24px; }
    .day-card{ min-width:132px; flex:1 1 132px; max-height:calc(100vh - 210px); }
    .day-num{ font-size:20px; }
    .task-text{ font-size:12.5px; }

    #larotMicBtn{ right:12px; bottom:12px; width:62px; height:62px; }
    #larotToast{ right:12px; bottom:82px; max-width:calc(100vw - 24px); }
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-inner">
      <span class="eyebrow">ALLTORAL · organização diária</span>
      <div class="title-row">
        <h1>Meu <span class="accent-script">Dia</span></h1>
      </div>
      <span class="subtitle">tudo colado, nada esquecido.</span>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn-nav" id="prevWeekBtn" aria-label="Semana anterior">‹</button>
    <span class="week-label" id="weekLabel"></span>
    <button class="btn-nav" id="nextWeekBtn" aria-label="Próxima semana">›</button>
    <button class="btn-today" id="todayBtn">hoje</button>
    <span class="offline-badge" id="offlineBadge">offline — salvando neste aparelho</span>
    <div class="toolbar-spacer"></div>
    <button class="btn-sync" id="syncBtn">sincronizar com Google Agenda</button>
    <span class="sync-status" id="syncStatus"></span>
  </div>

  <div class="board-wrap">
    <div class="week-checklist" id="weekChecklist">
      <div class="checklist-header">
        <span class="checklist-title">Essa semana</span>
        <span class="checklist-hint">arraste um item pra um dia da semana</span>
      </div>
      <div class="checklist-list" id="checklistList"></div>
      <div class="add-task-row">
        <input class="add-task-input" id="checklistInput" placeholder="+ item da semana" autocomplete="off" enterkeyhint="done">
        <button class="add-task-confirm" id="checklistConfirmBtn" type="button" aria-label="Adicionar item">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 5v5a3 3 0 0 1-3 3H5m0 0 4-4M5 13l4 4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="week-board" id="weekBoard"></div>
  </div>

</div>

<!-- Larot: assistente de voz -->
<button id="larotMicBtn" type="button" title="Falar com o Larot" aria-label="Falar com o Larot" style="display:none;">
  <img id="larotMicImgActive" src="./larot-avatar.png" alt="" draggable="false">
  <img id="larotMicImgMuted" src="./larot-avatar-muted.png" alt="" draggable="false">
</button>
<button id="larotDebugToggle" type="button" title="Depuração do Larot" aria-label="Depuração do Larot" style="display:none;">🐞</button>
<div id="larotDebugPanel"></div>
<div id="larotToast" role="status" aria-live="polite">
  <div id="larotToastMsg"></div>
</div>

<script type="module">

try {

(function(){
  const WEEKDAY_LABELS = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];

  // Fixed board code: this is a personal single-user app, so every device
  // should automatically share the same board with zero setup — no code to
  // type in anywhere.
  const boardCode = 'alltoral-meudia';

  function dateKey(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function isSameDate(a, b){ return dateKey(a) === dateKey(b); }
  function startOfWeek(d){
    const day = d.getDay(); // 0=Sun..6=Sat
    const diff = (day === 0 ? -6 : 1 - day); // shift back to Monday
    const monday = addDays(d, diff);
    monday.setHours(0,0,0,0);
    return monday;
  }
  function weekDates(weekStart){
    const arr = [];
    for(let i=0;i<7;i++) arr.push(addDays(weekStart, i));
    return arr;
  }
  function localKey(dk){ return 'tasks:' + boardCode + ':' + dk; }
  function checklistLocalKey(wk){ return 'checklist:' + boardCode + ':' + wk; }
  function pad2(n){ return n.toString().padStart(2,'0'); }

  let currentWeekStart = startOfWeek(new Date());
  const tasksByDate = {};
  const unsubs = {};
  const saveTimers = {};

  let currentChecklist = [];
  let checklistUnsub = null;

  const weekBoard = document.getElementById('weekBoard');
  const weekLabel = document.getElementById('weekLabel');
  const prevWeekBtn = document.getElementById('prevWeekBtn');
  const nextWeekBtn = document.getElementById('nextWeekBtn');
  const todayBtn = document.getElementById('todayBtn');
  const syncBtn = document.getElementById('syncBtn');
  const syncStatus = document.getElementById('syncStatus');
  const checklistList = document.getElementById('checklistList');
  const checklistInput = document.getElementById('checklistInput');
  const checklistConfirmBtn = document.getElementById('checklistConfirmBtn');

  function updateWeekLabel(dates){
    const fmt = (d)=> d.getDate() + ' ' + d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
    weekLabel.textContent = fmt(dates[0]) + ' – ' + fmt(dates[6]);
  }

  function addTask(dk, text, done){
    if(!tasksByDate[dk]) tasksByDate[dk] = [];
    tasksByDate[dk].push({
      id: 't' + Date.now() + Math.random().toString(36).slice(2,6),
      text: text,
      done: !!done
    });
    renderDay(dk);
    save(dk);
  }

  /* ---------- Arrastar pra copiar (entre dias, e do checklist pra um dia) ----------
     Usa Pointer Events com captura no próprio "manípulo" (o ⠿), que funciona
     igual em mouse e touch — o HTML5 drag-and-drop nativo não é confiável em
     navegadores de celular. Só inicia o arrasto depois de um pequeno limiar
     de movimento, pra não disparar sozinho com um toque rápido no manípulo. */
  function startDrag(e, handle, sourceDk, text, done, removeFromSource){
    if(!text) return;
    const startX = e.clientX, startY = e.clientY;
    let dragging = false;
    let ghost = null;
    let overEl = null;

    function ensureGhost(){
      if(ghost) return;
      ghost = document.createElement('div');
      ghost.className = 'larot-drag-ghost';
      ghost.textContent = text;
      document.body.appendChild(ghost);
    }
    function position(x,y){ if(ghost){ ghost.style.left = x+'px'; ghost.style.top = y+'px'; } }

    function onMove(ev){
      const dx = ev.clientX-startX, dy = ev.clientY-startY;
      if(!dragging && (Math.abs(dx)>8 || Math.abs(dy)>8)){
        dragging = true;
        ensureGhost();
      }
      if(!dragging) return;
      position(ev.clientX, ev.clientY);
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const card = el && el.closest('.day-card');
      if(overEl && overEl !== card) overEl.classList.remove('drag-over');
      if(card) card.classList.add('drag-over');
      overEl = card || null;
    }
    function onUp(){
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      handle.removeEventListener('pointercancel', onUp);
      if(ghost) ghost.remove();
      if(overEl){
        overEl.classList.remove('drag-over');
        if(dragging){
          const targetDk = overEl.dataset.date;
          if(targetDk && targetDk !== sourceDk){
            addTask(targetDk, text, done);
            if(removeFromSource) removeFromSource();
          }
        }
      }
    }
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
    handle.addEventListener('pointercancel', onUp);
  }

  /* sourceDk null = veio do checklist semanal (não tem dia fixo pra sair).
     O item some da origem só quando o arrasto termina de fato em cima de
     outro dia — soltar fora de um dia, ou sem mover o suficiente, não
     mexe em nada (evita perder o item com um toque acidental). */
  function makeDragHandle(sourceDk, getText, getDone, removeFromSource){
    const handle = document.createElement('span');
    handle.className = 'task-drag-handle';
    handle.textContent = '⠿';
    handle.setAttribute('aria-label', 'Arrastar pra outro dia');
    handle.addEventListener('pointerdown', function(e){
      e.preventDefault();
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      startDrag(e, handle, sourceDk, getText(), getDone ? getDone() : false, removeFromSource);
    });
    return handle;
  }

  function makeTaskEl(dk, task){
    const el = document.createElement('div');
    el.className = 'task-item' + (task.done ? ' done' : '') + (task.fromCalendar ? ' from-calendar' : '');
    el.dataset.id = task.id;

    const check = document.createElement('button');
    check.className = 'task-check';
    check.addEventListener('click', ()=>{
      task.done = !task.done;
      renderDay(dk);
      save(dk);
    });
    el.appendChild(check);

    const text = document.createElement('div');
    text.className = 'task-text';
    text.contentEditable = 'true';
    text.textContent = task.text;
    text.addEventListener('blur', ()=>{ task.text = text.textContent; save(dk); });
    el.appendChild(text);

    function removeThisTask(){
      tasksByDate[dk] = (tasksByDate[dk]||[]).filter(t=>t.id!==task.id);
      renderDay(dk);
      save(dk);
    }
    el.appendChild(makeDragHandle(dk, ()=> task.text, ()=> task.done, removeThisTask));

    const close = document.createElement('span');
    close.className = 'task-close';
    close.textContent = '×';
    close.addEventListener('click', (e)=>{
      e.stopPropagation();
      removeThisTask();
    });
    el.appendChild(close);

    return el;
  }

      list.appendChild(makeTaskEl(dk, task));

      header.appendChild(nameEl);
      header.appendChild(numEl);

      unsubs[dk] = onSnapshot(ref, (snap)=>{

    const payload = JSON.stringify(tasksByDate[dk] || []);
    try{ localStorage.setItem(localKey(dk), payload); }catch(err){}
    if(window.storage && typeof window.storage.set === 'function'){
      window.storage.set(localKey(dk), payload).catch(()=>{});

  let googleAccessToken = null;

  function getGoogleAccessToken(forceConsent){
    return new Promise((resolve, reject)=>{
      if(GOOGLE_CLIENT_ID.indexOf('COLE_') === 0){
        reject(new Error('missing-client-id'));
        return;
      }
      if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
        reject(new Error('gis-not-loaded'));
        return;
      }
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/calendar.readonly',
        callback: (resp)=>{
          if(resp.error){ reject(new Error(resp.error)); return; }
          googleAccessToken = resp.access_token;
          resolve(googleAccessToken);
        }
      });
      client.requestAccessToken({ prompt: forceConsent ? 'consent' : '' });
    });
  }

  syncBtn.addEventListener('click', async ()=>{
    syncBtn.disabled = true;
    syncStatus.textContent = 'conectando com sua conta Google...';
    try{
      const token = await getGoogleAccessToken(!googleAccessToken);
      syncStatus.textContent = 'buscando eventos da semana...';

      const dates = weekDates(currentWeekStart);
      const rangeStart = new Date(dates[0]); rangeStart.setHours(0,0,0,0);
      const rangeEnd = new Date(dates[6]); rangeEnd.setHours(23,59,59,999);
      const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events'
        + '?timeMin=' + encodeURIComponent(rangeStart.toISOString())
        + '&timeMax=' + encodeURIComponent(rangeEnd.toISOString())
        + '&singleEvents=true&orderBy=startTime';

      let res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
      if(res.status === 401){
        const fresh = await getGoogleAccessToken(true);
        res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + fresh } });
      }
      if(!res.ok) throw new Error('http-' + res.status);

      const data = await res.json();
      const grouped = {};
      (data.items || []).forEach(item=>{
        if(!item.start || !item.start.dateTime) return; // skip all-day events
        const start = new Date(item.start.dateTime);
        const dk = dateKey(start);
        if(!grouped[dk]) grouped[dk] = [];
        grouped[dk].push({
          id: 'g' + (item.id || Math.random().toString(36).slice(2)),
          text: pad2(start.getHours()) + ':' + pad2(start.getMinutes()) + ' ' + (item.summary || '(sem título)'),
          done: false,
          fromCalendar: true
        });
      });

      let total = 0;
      Object.keys(grouped).forEach(dk=>{
        const kept = (tasksByDate[dk] || []).filter(t=>!t.fromCalendar);
        tasksByDate[dk] = kept.concat(grouped[dk]);
        total += grouped[dk].length;
        renderDay(dk);
        save(dk);
      });

      syncStatus.textContent = total ? total + ' evento(s) da semana carregados' : 'nenhum evento essa semana 🎉';
    }catch(err){
      console.error(err);
      if(err.message === 'missing-client-id'){
        syncStatus.textContent = 'configure o Google Client ID (veja o LEIA-ME.md)';
      }else if(err.message === 'gis-not-loaded'){
        syncStatus.textContent = 'não consegui carregar o login do Google, tente recarregar a página';
      }else{
        syncStatus.textContent = 'não consegui conectar à agenda agora';
      }
    }finally{
      syncBtn.disabled = false;
    }
  });

  /* ---------- Larot: assistente de voz ----------
     Diferente do Workmana, aqui o Larot só cria post-its — rápido, em lote.
     Uma frase pode ter várias datas: "amanhã comprar leite, sexta reunião
     com cliente" cria um post-it em cada dia mencionado. Sem data nenhuma,
     cria no dia de hoje (pra ser rápido: só fala a tarefa e pronto). */
  function larotNormalize(text){
    return text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }
  function larotAddDaysDate(date, n){ const d = new Date(date.getTime()); d.setDate(d.getDate()+n); return d; }
  function larotToISO(date){ const d = new Date(date.getTime()); d.setHours(0,0,0,0); return dateKey(d); }

  function larotFindAllDates(text){
    const lower = larotNormalize(text);
    const today = new Date(); today.setHours(0,0,0,0);
    const matches = [];
    function addAll(re, resolver){
      re.lastIndex = 0;
      let m;
      while((m = re.exec(lower))){
        const d = resolver(m);
        if(d) matches.push({ start: m.index, end: m.index+m[0].length, date: d });
        if(m[0].length === 0) re.lastIndex++;
      }
    }
    addAll(/depois de amanha/g, ()=> larotToISO(larotAddDaysDate(today,2)));
    addAll(/\bamanha\b/g, ()=> larotToISO(larotAddDaysDate(today,1)));
    addAll(/\bhoje\b/g, ()=> larotToISO(today));
    addAll(/\b(?:em|daqui a)\s+(\d{1,2})\s+dias?\b/g, (m)=> larotToISO(larotAddDaysDate(today, parseInt(m[1],10))));
    addAll(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/g, (m)=>{
      const dd = parseInt(m[1],10), mm = parseInt(m[2],10)-1;
      const yyyy = m[3] ? (m[3].length===2 ? 2000+parseInt(m[3],10) : parseInt(m[3],10)) : today.getFullYear();
      return larotToISO(new Date(yyyy,mm,dd));
    });
    const MONTHS_PT = ['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    addAll(new RegExp('\\b(?:dia\\s+)?(\\d{1,2})\\s+de\\s+(' + MONTHS_PT.join('|') + ')\\b','g'), (m)=>{
      const dayM = parseInt(m[1],10), monthIdx = MONTHS_PT.indexOf(m[2]);
      let c = new Date(today.getFullYear(), monthIdx, dayM);
      if(c<today) c = new Date(today.getFullYear()+1, monthIdx, dayM);
      return larotToISO(c);
    });
    addAll(/\bdia\s+(\d{1,2})\b/g, (m)=>{
      const day = parseInt(m[1],10);
      let c = new Date(today.getFullYear(), today.getMonth(), day);
      if(c<today) c = new Date(today.getFullYear(), today.getMonth()+1, day);
      return larotToISO(c);
    });
    const WEEKDAYS = [['domingo',0],['segunda',1],['terca',2],['quarta',3],['quinta',4],['sexta',5],['sabado',6]];
    WEEKDAYS.forEach(function(w){
      addAll(new RegExp('(proxima\\s+)?\\b' + w[0] + '(-feira)?\\b','g'), function(){
        let diff = (w[1]-today.getDay()+7)%7;
        if(diff===0) diff = 7;
        return larotToISO(larotAddDaysDate(today, diff));
      });
    });
    matches.sort((a,b)=> a.start-b.start);
    const out = [];
    let lastEnd = -1;
    matches.forEach(function(mt){
      if(mt.start >= lastEnd){ out.push(mt); lastEnd = mt.end; }
    });
    return out;
  }

  const LAROT_FILLER_RE = /^(tarefa|lembrete|compromisso|adicionar|adiciona|criar|cria|coloca|colocar|marca|marcar|bota|por|poe|anota|anotar)\b[:,\s]*/i;
  function larotCleanTaskText(text){
    let t = text;
    t = t.replace(/^[\s,;:.!?\-–—]+|[\s,;:.!?\-–—]+$/g, '');
    let prev;
    do{ prev = t; t = t.replace(LAROT_FILLER_RE, ''); } while(t !== prev);
    t = t.replace(/^\s*(pra|para|pro|de|que)\s+/i, '');
    t = t.replace(/\s{2,}/g, ' ').trim();
    t = t.replace(/^[,.\-:;\s]+|[,.\-:;\s]+$/g, '');
    if(t) t = t.charAt(0).toUpperCase() + t.slice(1);
    return t;
  }

  function larotWeekdayShortLabel(dk){
    const parts = dk.split('-').map(Number);
    const d = new Date(parts[0], parts[1]-1, parts[2]);
    return WEEKDAY_LABELS[d.getDay()] + ' ' + d.getDate();
  }

  function larotSplitDayTasks(transcript){
    const dates = larotFindAllDates(transcript);
    const segments = [];
    if(dates.length === 0){
      const text = larotCleanTaskText(transcript);
      if(text) segments.push({ date: dateKey(new Date()), text: text });
      return segments;
    }
    for(let i=0;i<dates.length;i++){
      const segStart = dates[i].end;
      const segEnd = (i+1<dates.length) ? dates[i+1].start : transcript.length;
      const raw = transcript.slice(segStart, segEnd);
      const text = larotCleanTaskText(raw);
      if(text) segments.push({ date: dates[i].date, text: text });
    }
    return segments;
  }

  /* ---------- Larot: planejamento semanal (o checklist "Essa semana") ----------
     Gatilhos separados dos post-its por dia:
     - "essa semana" / "o que eu tenho essa semana" (sozinho, sem itens depois)
       → CONSULTA: descreve o que já está no checklist daquela semana.
     - "semana que vem" / "próxima semana" (sozinho)
       → CONSULTA do checklist da semana seguinte à de hoje.
     - "semana que vem: item, item, item" (com itens depois)
       → CRIA itens no checklist da semana seguinte à de hoje — pro ritual de
         toda quinta-feira planejar a semana seguinte, mesmo sem estar
         navegando pra lá na tela. */
  function larotWeekRangeLabel(weekStart){
    const dates = weekDates(weekStart);
    const fmt = (d)=> d.getDate() + ' ' + d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
    return fmt(dates[0]) + ' – ' + fmt(dates[6]);
  }

  async function larotLoadChecklistForWeek(weekStart){
    const wk = dateKey(weekStart);
    if(wk === dateKey(currentWeekStart)) return currentChecklist;
    if(db){
      try{
        const ref = doc(db, 'boards', boardCode + '_checklist_' + wk);
        const snap = await getDoc(ref);
        if(snap.exists()){
          const data = snap.data();
          if(Array.isArray(data.items)) return data.items;
        }
        return [];
      }catch(err){
        console.warn('Larot: erro ao buscar checklist da semana', err);
      }
    }
    let raw = null;
    try{ raw = localStorage.getItem(checklistLocalKey(wk)); }catch(err){}
    if(raw){ try{ return JSON.parse(raw); }catch(err){ return []; } }
    return [];
  }

  function larotDescribeChecklist(items, weekStart){
    const label = larotWeekRangeLabel(weekStart);
    if(!items || items.length === 0) return 'Nada planejado ainda pra semana de ' + label + '.';
    const parts = items.map(function(it){ return (it.done ? '✓ ' : '') + it.text; });
    return 'Semana de ' + label + ': ' + parts.join(' · ');
  }

  /* Grava num checklist mesmo que não seja o da semana visível na tela —
     por isso não pode reaproveitar addChecklistItem(), que só mexe no
     currentChecklist em memória (a semana mostrada no momento). */
  function larotAddChecklistItemFor(wk, text){
    if(wk === dateKey(currentWeekStart)){
      addChecklistItem(text);
      return;
    }
    const item = { id: 'c' + Date.now() + Math.random().toString(36).slice(2,6), text: text, done: false };
    let list = [];
    try{
      const raw = localStorage.getItem(checklistLocalKey(wk));
      if(raw) list = JSON.parse(raw);
    }catch(err){}
    list.push(item);
    try{ localStorage.setItem(checklistLocalKey(wk), JSON.stringify(list)); }catch(err){}
    if(db){
      const ref = doc(db, 'boards', boardCode + '_checklist_' + wk);
      getDoc(ref).then(function(snap){
        let items = [];
        if(snap.exists()){
          const data = snap.data();
          if(Array.isArray(data.items)) items = data.items;
        }
        items.push(item);
        return setDoc(ref, { items: items, updatedAt: Date.now() });
      }).catch(function(err){ console.warn('Larot: erro ao salvar checklist (outra semana) na nuvem', err); });
    }
  }

  const WEEK_QUERY_NEXT_RE = /^\s*(a\s+)?(semana que vem|proxima semana|semana seguinte)\s*[?.!]*\s*$|\b(o que (eu )?tenho|resumo|planejamento|lista)\b.*\b(semana que vem|proxima semana|semana seguinte)\b/;
  const WEEK_QUERY_THIS_RE = /^\s*essa semana\s*[?.!]*\s*$|\b(o que (eu )?tenho|resumo|planejamento|lista)\b.*\bessa semana\b/;
  const WEEK_PLAN_TRIGGER_RE = /\b(semana que vem|proxima semana|semana seguinte)\b/;

  function larotHandleVoiceCommand(transcript){
    if(!transcript || !transcript.trim()) return { ok:false, message:'Não ouvi nada.' };
    const clean = transcript.replace(/^[\s,;:.!?\-–—]+/, '').replace(/[\s,;:.!?\-–—]+$/, '');
    if(!clean) return { ok:false, message:'Não ouvi nada.' };
    const lower = larotNormalize(clean);

    if(WEEK_QUERY_NEXT_RE.test(lower)){
      const weekStart = addDays(startOfWeek(new Date()), 7);
      return larotLoadChecklistForWeek(weekStart).then(function(items){
        return { ok:true, message: larotDescribeChecklist(items, weekStart), speak:true };
      });
    }
    if(WEEK_QUERY_THIS_RE.test(lower)){
      const weekStart = startOfWeek(new Date());
      return larotLoadChecklistForWeek(weekStart).then(function(items){
        return { ok:true, message: larotDescribeChecklist(items, weekStart), speak:true };
      });
    }

    const planMatch = lower.match(WEEK_PLAN_TRIGGER_RE);
    if(planMatch){
      const rest = clean.slice(planMatch.index + planMatch[0].length).replace(/^[\s:,\-]+/, '');
      const items = rest.split(',').map(larotCleanTaskText).filter(Boolean);
      if(items.length){
        const wk = dateKey(addDays(startOfWeek(new Date()), 7));
        items.forEach(function(text){ larotAddChecklistItemFor(wk, text); });
        if(items.length === 1) return { ok:true, message: 'Planejamento da semana que vem: ' + items[0] };
        return { ok:true, message: items.length + ' itens no planejamento da semana que vem — ' + items.join(' · ') };
      }
    }

    const segments = larotSplitDayTasks(clean);
    if(segments.length === 0) return { ok:false, message:'Não consegui entender a tarefa.' };

    segments.forEach(function(seg){ addTask(seg.date, seg.text); });

    if(segments.length === 1){
      return { ok:true, message: larotWeekdayShortLabel(segments[0].date) + ': ' + segments[0].text };
    }
    const parts = segments.map(function(seg){ return larotWeekdayShortLabel(seg.date) + ': ' + seg.text; });
    return { ok:true, message: segments.length + ' post-its — ' + parts.join(' · ') };
  }

  window.LarotBridge = {
    appId: 'meudia',
    isReady: function(){ return true; },
    handleVoiceCommand: larotHandleVoiceCommand
  };
})();
</script>

<script>
(function(){
  "use strict";

  var micBtn = document.getElementById("larotMicBtn");
  var toastEl = document.getElementById("larotToast");
  if(!micBtn || !toastEl) return;

  var SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionImpl) return; // navegador sem suporte a voz: botão fica escondido

  var recognition = new SpeechRecognitionImpl();
  recognition.lang = "pt-BR";
  recognition.maxAlternatives = 1;
  recognition.continuous = true;     // não finaliza sozinho na primeira pausa curta
  recognition.interimResults = true; // pra mostrar o que está entendendo em tempo real

  var SILENCE_MS = 1600; // quanto tempo de silêncio de verdade até considerar que você terminou

  var toastTimer = null;
  var silenceTimer = null;
  var listening = false;  // true = capturando sua fala agora
  var finalChunks = "";   // texto final acumulado durante a captação atual

  /* Painel de depuração visível na tela — pra ver o que está acontecendo
     direto no celular (print da tela), sem precisar de ferramenta nenhuma
     conectada no computador. */
  var debugToggleBtn = document.getElementById("larotDebugToggle");
  var debugPanelEl = document.getElementById("larotDebugPanel");
  var debugLines = [];
  function larotLog(msg){
    console.log("[Larot]", msg);
    debugLines.push(new Date().toLocaleTimeString() + " — " + msg);
    if(debugLines.length > 40) debugLines.shift();
    if(debugPanelEl){
      debugPanelEl.textContent = debugLines.join("\n");
      debugPanelEl.scrollTop = debugPanelEl.scrollHeight;
    }
  }
  if(debugToggleBtn && debugPanelEl){
    debugToggleBtn.addEventListener("click", function(){
      debugPanelEl.classList.toggle("show");
    });
  }

  var toastMsgEl = document.getElementById("larotToastMsg");

  function showToast(text, ms){
    toastMsgEl.textContent = text;
    toastEl.classList.add("show");
    if(toastTimer) clearTimeout(toastTimer);
    if(ms !== 0){
      toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, ms || 5000);
    }
  }

  /* Só fala em voz alta as respostas marcadas com "speak" (as consultas de
     planejamento semanal) — o resto fica só no texto, pra não atrapalhar
     quem quer emendar vários comandos rápido. */
  var preferredVoice = null;
  var MALE_VOICE_HINT_RE = /male|masculin|homem|\b(daniel|ricardo|thiago|felipe|rafael|gustavo|f[aá]bio|rodrigo|bruno|marcos|paulo|jos[eé]|jo[aã]o|carlos|ant[oô]nio|pedro|fernando|eduardo|hugo|diego|leonardo|luiz|luís|miguel|davi|gabriel|lucas|matheus|andr[eé])\b/i;
  function pickVoice(){
    if(!("speechSynthesis" in window)) return;
    var voices = window.speechSynthesis.getVoices();
    var ptVoices = voices.filter(function(v){ return /^pt/i.test(v.lang); });
    var male = ptVoices.find(function(v){ return MALE_VOICE_HINT_RE.test(v.name); });
    preferredVoice = male || ptVoices[0] || null;
  }
  if("speechSynthesis" in window){
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  function speak(text){
    if(!("speechSynthesis" in window)) return;
    try{
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = "pt-BR";
      if(preferredVoice) utter.voice = preferredVoice;
      utter.pitch = 0.6;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }catch(e){}
  }

  function setListening(v){
    listening = v;
    micBtn.classList.toggle("listening", v);
  }

  function handleTranscript(transcript){
    larotLog("processando: " + JSON.stringify(transcript));
    var bridge = window.LarotBridge;
    if(!bridge || typeof bridge.handleVoiceCommand !== "function"){
      larotLog("LarotBridge indisponível");
      showToast("Larot não está disponível neste app ainda.");
      return;
    }
    // handleVoiceCommand pode devolver direto ou uma Promise (as consultas
    // de planejamento semanal buscam no Firestore antes de responder).
    Promise.resolve(bridge.handleVoiceCommand(transcript)).then(function(result){
      larotLog("resultado: " + JSON.stringify(result));
      var msg = (result && result.message) || (result && result.ok ? "Feito." : "Não consegui fazer isso.");
      showToast(msg);
      if(result && result.speak) speak(msg);
    });
  }

  /* Enquanto você fala, continuamos ouvindo até SILENCE_MS de silêncio de
     verdade (em vez de cortar na primeira pausa curta). Pra montar o texto,
     usamos sempre o ÚLTIMO resultado recebido como "tudo que você falou
     até agora" — em vez de somar vários trechos, o que em alguns celulares
     causava texto duplicado/repetido. */
  function handleResultEvent(e){
    var lastIdx = e.results.length - 1;
    if(lastIdx >= 0) finalChunks = e.results[lastIdx][0].transcript;
    larotLog("resultado #" + e.results.length + (e.results[lastIdx] && e.results[lastIdx].isFinal ? " (final)" : " (interino)") + ": " + JSON.stringify(finalChunks));
    if(finalChunks) showToast("Ouvindo: “" + finalChunks + "”", 0);

    if(silenceTimer) clearTimeout(silenceTimer);
    silenceTimer = setTimeout(function(){
      larotLog("silêncio detectado, finalizando");
      finishListening();
    }, SILENCE_MS);
  }
  recognition.addEventListener("result", handleResultEvent);

  function processAndReset(){
    if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer = null; }
    var transcript = finalChunks.trim();
    finalChunks = "";
    setListening(false);
    if(transcript) handleTranscript(transcript);
    else larotLog("nada pra processar (texto vazio)");
  }

  function finishListening(){
    if(!listening){ larotLog("finishListening chamado mas já não estava ouvindo"); return; }
    processAndReset();
    try{ recognition.stop(); }catch(e){ larotLog("erro ao chamar stop(): " + e); }
  }

  recognition.addEventListener("end", function(){
    larotLog("evento nativo 'end' disparou (listening=" + listening + ")");
    if(listening) processAndReset();
  });

  recognition.addEventListener("error", function(e){
    larotLog("evento 'error': " + e.error);
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){
      micBtn.classList.add("paused");
      showToast("Preciso de permissão pro microfone. Toque no personagem pra tentar de novo.");
      finalChunks = "";
      setListening(false);
      if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer = null; }
      return;
    }
    if(finalChunks.trim()){
      larotLog("erro no meio da fala, mas já tinha texto — processando mesmo assim");
      processAndReset();
      return;
    }
    if(e.error === "no-speech"){
      showToast("Não ouvi nada, tenta de novo.");
    } else if(e.error === "network"){
      showToast("Falha de conexão com o reconhecimento de voz. Tenta de novo.");
    }
    setListening(false);
    if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer = null; }
  });

  micBtn.addEventListener("click", function(){
    if(!window.LarotBridge || !window.LarotBridge.isReady()){
      showToast("Larot não está pronto ainda, espera um instante.");
      return;
    }
    if(listening){
      // toca de novo pra encerrar e processar antes do silêncio automático
      finishListening();
      return;
    }
    micBtn.classList.remove("paused");
    finalChunks = "";
    setListening(true);
    showToast("Ouvindo... (toca de novo quando terminar de falar)", 0);
    larotLog("iniciando escuta (recognition.start)");
    try{
      recognition.start();
    }catch(e){
      larotLog("erro ao chamar start(): " + e);
      setListening(false);
    }
  });

  // Sem tela de login aqui — o mic e o botão de depuração aparecem direto.
  micBtn.style.display = "flex";
  if(debugToggleBtn) debugToggleBtn.style.display = "flex";
})();
</script>
</body>
</html>
